services:
  # Local sync server: hosts the execution engine (plan/analyze/execute) and
  # the Binance public-data fetch behind a small HTTP API. This is what both
  # the browser and an MCP-connected Claude Code session poll/call.
  #
  # NOT deployed here: mcp/server.ts. It's a stdio MCP tool meant to run
  # locally inside a Claude Code session (spawned via `claude mcp add`), not
  # a hosted service — it has no HTTP surface of its own.
  - type: web
    name: slice-server
    env: node
    plan: free
    rootDir: slice
    buildCommand: npm install
    startCommand: npx tsx server/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"

  # Static Vite/React build.
  - type: web
    name: slice-app
    env: static
    rootDir: slice
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # `fromService: property: host` gives Render's private-network hostname
      # (e.g. "slice-server"), not the public https://<name>.onrender.com URL
      # a browser can reach — a static site's build needs the public one.
      # Set this by hand in the Render dashboard to slice-server's actual
      # public URL (Environment tab → slice-app), then trigger a redeploy so
      # Vite bakes it in. `sync: false` keeps blueprint re-applies from
      # overwriting your manual value.
      - key: VITE_SLICE_API_BASE
        sync: false
